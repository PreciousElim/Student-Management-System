databases:
  - name: sms_db
    plan: free
    databaseName: sms
    user: sms


services:
  - type: web
    name: student-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createsuperuser --noinput || true
    startCommand: gunicorn sms.wsgi:application

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sms_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin1
      - key: DJANGO_SUPERUSER_EMAIL
        value: official3lim@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: False
