databases:
  - name: sms_db
    plan: free
    databaseName: sms
    user: sms


services:
  - type: web
    name: student-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn sms.wsgi:application

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sms_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
